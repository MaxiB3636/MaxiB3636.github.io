<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiosco Digital - Golosinas</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f7f9fc;
            color: #333;
            padding: 20px;
        }
        header {
            text-align: center;
            padding: 30px 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 15px;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }
        header p {
            font-size: 14px;
            opacity: 0.9;
        }
        .buscador {
            width: 100%;
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }
        .buscador:focus {
            border-color: #764ba2;
        }
        .categoria-titulo {
            font-size: 18px;
            color: #4a5568;
            margin: 15px 0 10px 5px;
            border-left: 4px solid #764ba2;
            padding-left: 8px;
        }
        .grid-productos {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }
        .producto-card {
            background: white;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: 1px solid #edf2f7;
        }
        .producto-nombre {
            font-size: 15px;
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 8px;
        }
        .producto-precio {
            font-size: 16px;
            font-weight: bold;
            color: #2b6cb0;
        }
        footer {
            text-align: center;
            margin-top: 40px;
            font-size: 12px;
            color: #a0aec0;
            padding: 10px;
        }
    </style>
</head>
<body>

    <header>
        <h1>🍬 Dulce Antojo 🍭</h1>
        <p>Escanear, elegí y disfrutá</p>
    </header>

    <input type="text" id="inputBuscar" class="buscador" placeholder="Buscar golosina..." onkeyup="filtrarProductos()">

    <h2 class="categoria-titulo">Chocolates</h2>
    <div class="grid-productos">
        <div class="producto-card">
            <div class="producto-nombre">Alfajor Marplatense</div>
            <div class="producto-precio">$1.200</div>
        </div>
        <div class="producto-card">
            <div class="producto-nombre">Chocolate con Almendras</div>
            <div class="producto-precio">$1.800</div>
        </div>
        <div class="producto-card">
            <div class="producto-nombre">Barrita de Frutilla</div>
            <div class="producto-precio">$800</div>
        </div>
    </div>

    <h2 class="categoria-titulo">Gomitas y Caramelos</h2>
    <div class="grid-productos">
        <div class="producto-card">
            <div class="producto-nombre">Gomitas Ácidas Mix</div>
            <div class="producto-precio">$950</div>
        </div>
        <div class="producto-card">
            <div class="producto-nombre">Caramelos de Miel (100g)</div>
            <div class="producto-precio">$700</div>
        </div>
        <div class="producto-card">
            <div class="producto-nombre">Chupetín Frutal</div>
            <div class="producto-precio">$350</div>
        </div>
    </div>

    <footer>
        <p>© 2026 - MaxiB3636 Golosinas</p>
    </footer>

    <script>
        function filtrarProductos() {
            let input = document.getElementById('inputBuscar').value.toLowerCase();
            let cards = document.getElementsByClassName('producto-card');
            
            for (let i = 0; i < cards.length; i++) {
                let nombre = cards[i].getElementsByClassName('producto-nombre')[0].innerText.toLowerCase();
                if (nombre.includes(input)) {
                    cards[i].style.display = "";
                } else {
                    cards[i].style.display = "none";
                }
            }
        }
    </script>
</body>
</html>
