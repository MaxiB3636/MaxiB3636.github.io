<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>E-Commerce - TECLAB</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="shortcut icon" href="assets/images/gadgets-icon.png" type="image/png">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="assets/css/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module" src="assets/js/index.js"></script> 
</head> 

<body>
    <header>
        <div class="navigation-header">
            <h1>PEDILO YA</h1>
            <p>Tu E-Commerce de productos favorito.</p>
        </div>
        <div class="checkout-header" title="Ir al carrito">
            <span class="material-symbols-outlined search-icon">
                shopping_cart_checkout
            </span>
        </div>
    </header>

    <main>
        <div class="search-bar">
            <search>
                <input type="search" 
                       id="inputSearch" 
                       placeholder="Ingresa el producto a buscar."
                       autocomplete="off"
                >
            </search>
        </div>

        <div class="container-categories">
            
        </div>

        <div class="products-container">

        </div>
    </main>

    <footer>
        <div class="footer">
            <h2>&copy; 2026 - Fernando Luna para TECLAB</h2>
            <p>Proyecto modelo utilizado en la materia <strong>INTERFAZ DE DESARROLLO</strong></p>
        </div>
    </footer>
    
</body>
</html>
